name: Compilar APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma Android 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || echo "sdkmanager no pudo instalar; se usan los paquetes que ya trae el runner"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk launcher.apk

      - name: Publicar release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Launcher build ${{ github.run_number }}
          files: launcher.apk
          fail_on_unmatched_files: true
